<footer class="footer">
  <div class="footer__inner">
    <div class="footer__brand">
      <img class="footer__logo" src="logo-tuct.png" alt="" aria-hidden="true" width="44" height="44" />
      <p class="footer__nome">Tenda de Umbanda<br />Cabocla Tapaji</p>
    </div>

    <div class="footer__contato">
      <p class="footer__linha">
        <svg class="footer__icone" viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M12 21s-7-6.1-7-11.2C5 6 8.1 3 12 3s7 3 7 6.8C19 14.9 12 21 12 21Z"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linejoin="round"
          />
          <circle cx="12" cy="9.8" r="2.4" fill="none" stroke="currentColor" stroke-width="1.6" />
        </svg>
        <span>{{ endereco }}</span>
      </p>

      <a class="footer__linha footer__linha--link" [href]="telefoneUrl">
        <svg class="footer__icone" viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1.1-.3 1.2.4 2.5.6 3.8.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.9 21 3 13.1 3 3.7c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.6.6 3.8.1.4 0 .8-.3 1.1L6.6 10.8Z"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linejoin="round"
          />
        </svg>
        <span>{{ telefoneExibicao }}</span>
      </a>
    </div>

    <div class="footer__redes">
      <a
        class="footer__rede"
        [href]="whatsappUrl"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Falar no WhatsApp"
      >
        <svg class="footer__icone" viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M12 3a9 9 0 0 0-7.8 13.5L3 21l4.6-1.2A9 9 0 1 0 12 3Z"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
          />
          <path
            d="M8.5 8.6c.2-.5.5-.5.8-.5h.6c.2 0 .5 0 .7.5.3.6.9 2 1 2.1.1.2.1.4 0 .6-.1.2-.2.3-.3.5-.2.2-.3.3-.1.6.6 1 1.3 1.7 2.3 2.2.2.1.4.1.6-.1l.5-.6c.2-.3.4-.2.6-.1l1.8.9c.2.1.4.2.4.4.1.6-.1 1.3-.5 1.7-.4.4-1.2.7-1.8.6-1.7-.2-3.3-1-4.6-2.2-1.1-1.1-2-2.5-2.4-4-.2-.7 0-1.5.4-2Z"
            fill="currentColor"
          />
        </svg>
        <span>WhatsApp</span>
      </a>

      <a
        class="footer__rede"
        [href]="instagramUrl"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Ver Instagram"
      >
        <svg class="footer__icone" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3.5" y="3.5" width="17" height="17" rx="5" fill="none" stroke="currentColor" stroke-width="1.6" />
          <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.6" />
          <circle cx="17" cy="7" r="1.1" fill="currentColor" />
        </svg>
        <span>{{ instagramHandle }}</span>
      </a>
    </div>
  </div>

  <p class="footer__base">© {{ anoAtual }} Tenda de Umbanda Cabocla Tapaji</p>
</footer>
